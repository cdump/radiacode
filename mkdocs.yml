site_name: RadiaCode Python Library
site_description: Python interface for RadiaCode-10x radiation detectors and spectrometers
site_url: https://cdump.github.io/radiacode/
repo_url: https://github.com/cdump/radiacode
repo_name: cdump/radiacode
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Connections: guides/connections.md
      - Measurements and units: guides/measurements.md
      - Spectra and calibration: guides/spectra.md
      - Device configuration: guides/configuration.md
      - Included examples: guides/examples.md
  - API reference:
      - Overview: reference/index.md
      - Device: reference/device.md
      - Data records: reference/data.md
      - Enums: reference/enums.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: Copyright &copy; Maxim Andreev and contributors
