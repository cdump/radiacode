[project]
name = "radiacode"
version = "0.4.0"
description = "Library for RadiaCode-101"
authors = [{ name = "Maxim Andreev", email = "andreevmaxim@gmail.com" }]
requires-python = ">=3.9"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "bleak>=1.1.1,<4",
    "pyusb~=1.3.1",
]

[project.optional-dependencies]
examples = [
    "aiohttp>=3.13.5,<4",
    "prometheus-client~=0.25.0",
    "matplotlib>=3.9.4,<4",
    "numpy>=2.0.2,<3",
    "pyyaml~=6.0.3",
]

[project.urls]
Homepage = "https://github.com/cdump/radiacode"
Documentation = "https://cdump.github.io/radiacode/"
Repository = "https://github.com/cdump/radiacode"

[dependency-groups]
dev = [
    "ruff>=0.15.22,<0.16",
    "mypy>=1.19.1,<2",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.0,<10",
    "mkdocstrings[python]>=0.30.0,<1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { uv-build = false }

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
extend-select = ["B", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
